<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<title>Leiturar – Login</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #1C3B3B;
        font-family: Arial, sans-serif;
    }

    .login-container {
        background-color: #C9FF8F;
        width: 380px;
        padding: 30px 35px;
        border-radius: 10px;
        border: 2px solid #000;
        box-shadow: 0 0 14px rgba(0,0,0,0.35);
        text-align: center;
    }

    .login-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 20px;
        color: black;
    }

    .login-container input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        font-size: 15px;
        border: 1px solid black;
        border-radius: 5px;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background-color: #7CD957;
        color: black;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid #000;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-btn:hover {
        transform: scale(1.03);
        background-color: #6bd04c;
    }

    .forgot-link {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        color: black;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }

    /* POP-UP */
    .popup-background {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
    }

    .popup-box {
        background: #C9FF8F;
        width: 350px;
        padding: 25px;
        border-radius: 10px;
        border: 2px solid black;
        box-shadow: 0 0 14px rgba(0,0,0,0.35);
        text-align: center;
    }

    .popup-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .popup-box input {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border: 1px solid black;
        border-radius: 5px;
    }

    .close-btn {
        background-color: #ff6b6b;
        border: 2px solid black;
        padding: 8px;
        width: 100%;
        margin-top: 5px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .close-btn:hover {
        transform: scale(1.03);
        background-color: #ff5252;
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-title">LOGIN</div>

    <form>
        <input type="text" placeholder="RA" required />
        <input type="password" placeholder="Senha" required />

        <button type="submit" class="login-btn">ENTRAR</button>

        <a class="forgot-link" onclick="abrirPopup()">Esqueci a senha</a>
    </form>
</div>

<!-- POP-UP DE RECUPERAÇÃO -->
<div class="popup-background" id="popup">
    <div class="popup-box">
        <div class="popup-title">Recuperar senha</div>

        <input type="text" id="popupRA" placeholder="Seu RA" required>
        <input type="email" id="popupEmail" placeholder="Seu email cadastrado" required>

        <button class="login-btn" onclick="enviarRecuperacao()">ENVIAR</button>
        <button class="close-btn" onclick="fecharPopup()">FECHAR</button>
    </div>
</div>

<script>
function abrirPopup() {
    document.getElementById("popup").style.display = "flex";
}

function fecharPopup() {
    document.getElementById("popup").style.display = "none";
}

function enviarRecuperacao() {
    const ra = document.getElementById("popupRA").value;
    const email = document.getElementById("popupEmail").value;

    if (!ra || !email) {
        alert("Preencha todos os campos!");
        return;
    }

    alert("Caso exista uma conta associada, enviaremos um email de recuperação.");
    fecharPopup();
}
</script>

</body>
</html>
