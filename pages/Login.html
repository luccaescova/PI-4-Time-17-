<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leiturar – Login</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        /* FUNDO NOVO — verde petróleo elegante */
        background-color: #1C3B3B;

        font-family: Arial, sans-serif;
    }

    .login-container {
        background-color: #C9FF8F; /* verde claro igual ao layout */
        width: 380px;
        padding: 30px 35px;
        border-radius: 10px;
        border: 2px solid #000;
        box-shadow: 0 0 14px rgba(0,0,0,0.35);
        text-align: center;
    }

    .login-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 20px;
        color: black;
    }

    .login-container input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        font-size: 15px;
        border: 1px solid black;
        border-radius: 5px;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background-color: #7CD957;
        color: black;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid #000;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-btn:hover {
        transform: scale(1.03);
        background-color: #6bd04c;
    }

    .forgot-link {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        color: black;
        text-decoration: none;
        font-weight: bold;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-title">LOGIN</div>

    <form>
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Senha" required />

        <button type="submit" class="login-btn">ENTRAR</button>

        <a href="#" class="forgot-link">Esqueci a senha</a>
    </form>
</div>

</body>
</html>
