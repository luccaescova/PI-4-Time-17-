<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiturar - Simulado</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;

        /* NOVO FUNDO MAIS BONITO */
        background: linear-gradient(135deg, #1E1E1E, #2b4d1f, #3d7a2c);
        background-size: cover;

        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 0;
        min-height: 100vh;
    }

    .container {
        background-color: #C9FF8F;
        width: 900px;
        margin-top: 30px;

        /* novo espaçamento para não ficar espremido */
        padding-bottom: 40px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0px 0px 25px rgba(0,0,0,0.4);
    }

    header {
        display: flex;
        align-items: center;
        padding: 20px 30px;
        background-color: #C9FF8F;
    }

    .menu-icon {
        width: 35px;
        height: 10px;
        background-color: black;
        position: relative;
        margin-right: 20px;
    }

    .menu-icon::before,
    .menu-icon::after {
        content: "";
        width: 35px;
        height: 10px;
        background-color: black;
        position: absolute;
        left: 0;
    }

    .menu-icon::before { top: -8px; }
    .menu-icon::after { top: 8px; }

    .logo {
        font-size: 28px;
        font-weight: bold;
        color: black;
    }

    .content {
        background-color: white;
        margin: 25px auto;
        width: 90%;
        padding: 28px;
        border-radius: 7px;
        border: 1px solid #000;
    }

    .question-title {
        text-align: center;
        font-weight: bold;
        margin-bottom: 18px;
        font-size: 22px;
    }

    .question-text {
        font-size: 18px;
        margin-bottom: 20px;
        line-height: 22px;
    }

    .option {
        margin-top: 14px;
        display: flex;
        align-items: center;
        font-size: 18px;
        cursor: pointer;
    }

    .option input {
        transform: scale(1.3);
        margin-right: 10px;
        cursor: pointer;
    }

    /* PAGINAÇÃO */
    .pagination {
        display: flex;
        list-style: none;
        padding-left: 0;
        justify-content: center;
        margin-top: 22px;
    }

    .pagination li {
        margin: 0 6px;
    }

    .page-link {
        display: block;
        padding: 8px 12px;
        background: white;
        border: 1px solid black;
        text-decoration: none;
        color: black;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
    }

    .page-item.active .page-link {
        background: #7CE96C;
    }

    .page-item.disabled .page-link {
        opacity: 0.5;
        pointer-events: none;
        cursor: default;
    }

    /* BOTÃO ENVIAR (apenas na última questão) */
    #submitBtn {
        display: none;
        margin-top: 25px;
        padding: 12px 20px;
        background-color: #2b8a2b;
        color: white;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }

    #submitBtn:hover {
        background-color: #247524;
    }
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="menu-icon"></div>
        <div class="logo">Leiturar</div>
    </header>

    <div class="content">

        <div id="title" class="question-title">Questão 1</div>

        <div id="questionText" class="question-text"></div>

        <label class="option">
            <input type="radio" name="questao" id="altA">
            <span id="textA"></span>
        </label>

        <label class="option">
            <input type="radio" name="questao" id="altB">
            <span id="textB"></span>
        </label>

        <label class="option">
            <input type="radio" name="questao" id="altC">
            <span id="textC"></span>
        </label>

        <label class="option">
            <input type="radio" name="questao" id="altD">
            <span id="textD"></span>
        </label>

        <ul id="pagination" class="pagination"></ul>

        <!-- NOVO BOTÃO ENVIAR -->
        <button id="submitBtn">Enviar respostas</button>

    </div>
</div>

<script>
/* -------------------------------
   QUESTÕES
---------------------------------*/
const questions = [
    {
        text: "Qual é a função principal de um sistema operacional?",
        A: "Gerenciar o hardware e fornecer serviços para os programas.",
        B: "Executar apenas jogos e aplicativos multimídia.",
        C: "Criar documentos automaticamente.",
        D: "Impedir que o usuário faça alterações no computador."
    },
    {
        text: "O que significa 'multitarefa'?",
        A: "Capacidade de executar vários programas ao mesmo tempo.",
        B: "Capacidade de desligar o computador automaticamente.",
        C: "Capacidade de armazenar arquivos na nuvem.",
        D: "Capacidade de executar apenas um programa por vez."
    },
    {
        text: "Qual dos itens abaixo NÃO é um sistema operacional?",
        A: "Windows 10",
        B: "Linux Ubuntu",
        C: "Android",
        D: "Google Chrome"
    }
];

/* -------------------------------
   ESTADO / CONTROLE
---------------------------------*/
let currentIndex = 0;

// Array que armazena qual alternativa foi marcada em cada pergunta
// Ex: ["A", "C", "B"]
let selectedAnswers = [null, null, null];

/* -------------------------------
   ELEMENTOS DA TELA
---------------------------------*/
const titleEl = document.getElementById("title");
const qText = document.getElementById("questionText");
const textA = document.getElementById("textA");
const textB = document.getElementById("textB");
const textC = document.getElementById("textC");
const textD = document.getElementById("textD");
const paginationEl = document.getElementById("pagination");
const submitBtn = document.getElementById("submitBtn");

/* -------------------------------
   CARREGAR QUESTÃO NA TELA
---------------------------------*/
function loadQuestion(i) {
    const q = questions[i];

    titleEl.textContent = "Questão " + (i + 1);
    qText.textContent = q.text;

    textA.textContent = "A) " + q.A;
    textB.textContent = "B) " + q.B;
    textC.textContent = "C) " + q.C;
    textD.textContent = "D) " + q.D;

    // DESMARCA TODAS
    document.querySelectorAll("[name='questao']").forEach(r => r.checked = false);

    // MARCA A ANTERIOR SE EXISTIR
    if (selectedAnswers[i]) {
        document.getElementById("alt" + selectedAnswers[i]).checked = true;
    }

    // Mostrar botão ENVIAR apenas na última
    submitBtn.style.display = (i === questions.length - 1) ? "block" : "none";

    updateSubmitState();
}

/* -------------------------------
   PAGINAÇÃO
---------------------------------*/
function renderPagination() {
    paginationEl.innerHTML = "";

    paginationEl.innerHTML += `
        <li class="page-item ${currentIndex === 0 ? "disabled" : ""}">
            <a class="page-link" href="#" onclick="goTo(${currentIndex - 1})">Previous</a>
        </li>
    `;

    for (let i = 0; i < questions.length; i++) {
        paginationEl.innerHTML += `
            <li class="page-item ${i === currentIndex ? "active" : ""}">
                <a class="page-link" href="#" onclick="goTo(${i})">${i + 1}</a>
            </li>
        `;
    }

    paginationEl.innerHTML += `
        <li class="page-item ${currentIndex === questions.length - 1 ? "disabled" : ""}">
            <a class="page-link" href="#" onclick="goTo(${currentIndex + 1})">Next</a>
        </li>
    `;
}

/* -------------------------------
   SALVA A RESPOSTA DA QUESTÃO ATUAL
---------------------------------*/
function saveAnswer() {
    const selected = document.querySelector("[name='questao']:checked");

    if (selected) {
        selectedAnswers[currentIndex] = selected.id.replace("alt", "");
    } else {
        selectedAnswers[currentIndex] = null;
    }

    updateSubmitState();
}

/* -------------------------------
   VERIFICA SE PODE ENVIAR
---------------------------------*/
function updateSubmitState() {
    const allAnswered = selectedAnswers.every(ans => ans !== null);

    if (allAnswered) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        submitBtn.style.cursor = "pointer";
    } else {
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";
        submitBtn.style.cursor = "not-allowed";
    }
}

/* -------------------------------
   NAVEGAR ENTRE QUESTÕES
---------------------------------*/
function goTo(i) {
    saveAnswer(); // <--- SALVA ANTES DE SAIR

    if (i < 0 || i >= questions.length) return;

    currentIndex = i;
    loadQuestion(i);
    renderPagination();
}

/* -------------------------------
   BOTÃO ENVIAR
---------------------------------*/
submitBtn.addEventListener("click", () => {
    if (selectedAnswers.every(a => a !== null)) {
        alert("As respostas foram enviadas! (Correção será adicionada depois)");
    }
});

/* -------------------------------
   CAPTURAR CLIQUES NAS ALTERNATIVAS
---------------------------------*/
document.querySelectorAll("[name='questao']").forEach(radio => {
    radio.addEventListener("change", saveAnswer);
});

/* -------------------------------
   INICIALIZAÇÃO
---------------------------------*/
loadQuestion(0);
renderPagination();
updateSubmitState();
</script>

</body>
</html>
